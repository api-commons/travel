      last_name: [lastname, surname, family_name]
      email: [email_address, emails]
      phone: [phone_number, phones, mobile]
      date_of_birth: [dob, birth_date, born_on]
      nationality: [country, citizenship, nationality_code]
      loyalty_number: [loyalty_id, membership_number, frequent_flyer_number, loyalty_programme_accounts]
  flight:
    segments: [flights, flight, flight_offers, flight-offers, flightoffers, air_offers, segments@flights|offers|air, offers@air|flights, schedules@flights|air]
    aliases:
      origin: [departure_airport, from, origin_airport, departure, departure_iata, origin_code]
      destination: [arrival_airport, to, destination_airport, arrival, arrival_iata, destination_code]
      departs_at: [departure_time, departing_at, departure_date_time, scheduled_departure, departure_at]
