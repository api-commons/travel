context: travel
name: Travel and Lodging
intro: >-
  The common travel vocabulary -- the hotels and stays a traveller books, the room types
  and rate plans behind the price, the reservations themselves, the guests on them and the
  flights that get them there -- distilled from the APIs that already exist.
tags: [Travel, Hospitality, Booking, Hotels, Airlines, Aviation, Vacation Rentals, Tourism, Online Travel, Short-Term Rentals]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, dictionaries]

