exclude:
  booking:
    agendapro: appointment bookings (scheduling context)
    cliniko: clinic appointment bookings (scheduling context)
    cargoai: air-cargo bookings
  rate_plan:
    avis-budget: car-rental rates
    lighthouse-travel: historic rate-shopping data, not a rate plan
duplicates:
  crunchtime: [crunchtime-information-systems]
  cvent: [cvent-hospitality-cloud]
  dot: [department-of-transportation]

findings:
  - "A booking agrees only on id and status. Check-in, check-out and the guests sit at 37%:
    hotel stays, flights, tours and car rentals are all bookings with different shapes."
  - "A hotel agrees on name, address and id; amenities and star rating are modelled by too few
    to share."
  - "Flights agree on nothing, not even an id (42%): NDC-style offers, schedules and flight
    status are three different resources published under one word."
  - "Guests and rooms are thin (5-7 providers): property-management systems and channel
    managers keep their APIs to partners."
decisions:
  - "A booking is `/bookings`: bookings lead reservations 42 to 19, and the scheduling context
    uses `/appointments`, so the word is free. Appointment bookings (AgendaPro, Cliniko) are
    excluded here and counted there."
  - "A hotel is `/hotels`; Expedia's and Booking.com's bare `/properties` counts as a hotel at a
    provider that also takes bookings, because property management uses the same word for
    buildings."
  - "A room is `/rooms` (rooms lead room types 7 to 2); a rate plan stays `/rate-plans`, though
    `rates` leads, because a bare rate is FX or tax elsewhere."
  - "Passengers and travellers are guests."
  - "Car-rental rates and air-cargo bookings are out of scope and excluded by name."
  - "Duplicates merged: CrunchTime, Cvent, DOT."
