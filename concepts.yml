  id: [uuid, guid, object_id, record_id, code, hotel_id, property_id, reservation_id, booking_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, booked_at, booking_date]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, reservation_status, booking_status]
  name: [title, display_name, label, hotel_name, property_name]
  description: [notes, note, details, summary]
  currency: [currency_code, iso_currency_code]
  check_in: [arrival, arrival_date, checkin, check_in_date, start_date, from, checkin_date, start]
  check_out: [departure, departure_date, checkout, check_out_date, end_date, to, checkout_date, end]
  hotel_id: [hotel, property_id, property, listing_id, accommodation_id]
  price: [total, amount, total_price, total_amount, price_total, grand_total, rate_amount]

concepts:
  booking:
    segments: [bookings, booking, reservations, reservation, stays, trips, orders@flights|air|booking|hotels]
    aliases:
      guest_ids: [guests, guest, guest_id, travelers, travellers, primary_guest, booker, customer_id, customer]
      confirmation_number: [confirmation_code, confirmation_id, reference, booking_reference, pnr, locator, record_locator]
      room_id: [room, rooms, room_type, room_type_id, room_type_code, unit_type_id]
      rate_plan_id: [rate_plan, rate_plan_code, rate_code, rate_id]
      adults: [number_of_adults, adult_count, guests_count, occupancy, num_guests, pax]
      children: [number_of_children, child_count, kids]
      channel: [source, booking_source, ota, channel_code, origin]
      cancelled_at: [canceled_at, cancellation_date, cancelled_date]
  hotel:
    # A bare /properties is how Expedia and Booking.com name hotels; it counts at a provider
    # that also takes reservations (property management uses the same word for buildings).
    requires: [booking]
    segments: [hotels, hotel, accommodations, lodgings, properties, property, stays@search, listings@vacation|rentals]
    aliases:
      address: [location, street_address, address_line1]
      star_rating: [rating, stars, category, star_rating_code]
      latitude: [lat, geocode_latitude]
      longitude: [lng, lon, long]
      chain_code: [chain, brand, brand_code, chain_id]
      amenities: [facilities, features, amenity_codes]
      time_zone: [timezone, tz]
  room:
    requires: [booking]
    segments: [rooms, room, room_types, room-types, roomtypes, unit_types, accommodation_types, room_categories]
    aliases:
      max_occupancy: [occupancy, max_guests, capacity, max_persons, max_adults]
      bed_type: [beds, bed_types, bedding]
      quantity: [count, inventory, number_of_rooms, total_rooms]
  rate_plan:
    requires: [booking]
    path: /rate-plans
    segments: [rate_plans, rate-plans, rateplans, rates, rate, pricing_plans, tariffs]
    aliases:
      code: [rate_plan_code, rate_code]
      meal_plan: [board, board_type, meal_plan_code, breakfast_included]
      refundable: [is_refundable, cancellation_policy, cancellation_policies, non_refundable]
      room_id: [room, room_type, room_type_id, room_type_code]
